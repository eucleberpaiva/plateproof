# Calibração de uma cena real: cruzamento em Fresno (Califórnia, EUA), câmera de trânsito fixa, vídeo 1920x1080.
# É a calibração usada nos números medidos do README. O vídeo NÃO faz parte do repositório: para rodar o Vigia,
# grave ou obtenha um vídeo que você tem direito de usar e copie este arquivo como ponto de partida.
#
# Todas as coordenadas são em pixels do vídeo ORIGINAL. Para achar coordenadas, tire um quadro com
#   python -m vigia.amostrar seu-video.mp4 saida --n 3
# e abra a imagem em qualquer editor que mostre a posição do cursor.

[deteccao]
veiculos_conf = 0.35     # YOLOX: abaixo disso a caixa é descartada
placa_conf = 0.25        # detector de placa
ocr_placa_conf = 0.4     # só roda o OCR em placa detectada com pelo menos esta confiança...
ocr_largura_min = 40     # ...e pelo menos esta largura em px (menor que isso o OCR só chuta)
# Gráficos sobrepostos pelo canal (selo, relógio, título) que o detector confunde com placa: ali não se lê nem se
# conta placa, mas o que for detectado ainda é pixelado no vídeo público. [x1, y1, x2, y2]
ignorar = [[0, 780, 240, 1080], [0, 0, 560, 50], [940, 0, 1340, 50]]

[rastreio]
min_quadros = 20         # rastro mais curto que isso (0,67 s a 30 q/s) é ruído do detector e não conta

[relogio]
inicio = "09:06:56"      # opcional: hora mostrada na câmera no primeiro quadro, para o visor mostrar a hora da cena

# ── Semáforos ──────────────────────────────────────────────────────────────────
# Caixa [x, y, largura, altura] cobrindo o grupo focal inteiro: vermelho no terço de cima, amarelo, verde.
# Calibrado olhando um quadro com vermelho e um com verde: lente acesa ~255 de brilho, apagada 110–160.
# fluxo = true: este semáforo define a fase usada para cruzar com a contagem (consenso entre os marcados).

[semaforo_leitura]
acesa = 230              # brilho mínimo da lente acesa
margem = 50              # quanto ela precisa superar a segunda mais clara

[[semaforo]]
nome = "conversao"
caixa = [1074, 201, 14, 51]
fluxo = false

[[semaforo]]
nome = "frente_a"
caixa = [1446, 231, 14, 51]
fluxo = true

[[semaforo]]
nome = "frente_b"
caixa = [1645, 265, 15, 51]
fluxo = true

# ── Linhas de contagem ─────────────────────────────────────────────────────────
# O ponto do veículo é o meio da base da caixa. Cada veículo conta uma vez, na PRIMEIRA linha da lista que
# ele cruzar (a ordem importa). Sentido "direita_para_esquerda": imagine alguém andando de `de` até `ate`
# na tela; conta quem passa do lado direito dessa pessoa para o esquerdo. "qualquer": os dois sentidos.
# A linha pode passar da borda do quadro de propósito, para não cortar quem cruza rente à borda.
# desloc_x / desloc_y (opcional): deslocamento total da trajetória exigido, intervalo aberto [min, max].
# placas = true: veículos desta linha mostram a placa para a câmera e entram na estatística de leitura.

[[linha]]
nome = "frente"
rotulo = "Seguem em frente, se afastando"
de = [300, 720]
ate = [3000, 720]
sentido = "direita_para_esquerda"
desloc_y = [-inf, -60]
placas = true

[[linha]]
nome = "contrario"
rotulo = "Vêm no sentido contrário"
de = [700, 2000]
ate = [700, -1000]
sentido = "direita_para_esquerda"
desloc_x = [-inf, -300]
desloc_y = [60, inf]
placas = true

[[linha]]
nome = "transversal_oeste"
rotulo = "Cruzam pela transversal, para a esquerda"
de = [960, 2000]
ate = [960, -1000]
sentido = "qualquer"
desloc_x = [-inf, -500]
desloc_y = [-200, 200]

[[linha]]
nome = "transversal_leste"
rotulo = "Cruzam pela transversal, para a direita"
de = [960, 2000]
ate = [960, -1000]
sentido = "qualquer"
desloc_x = [500, inf]
desloc_y = [-200, 200]

# ── Placas ─────────────────────────────────────────────────────────────────────
[placas]
voto_conf_min = 0.6      # leitura de OCR abaixo disso não vota
tamanho = [5, 8]         # número de caracteres aceitos (placa dos EUA; Mercosul tem 7)
leituras_min = 3         # placa só é "lida" com pelo menos 3 leituras...
acordo_min = 0.75        # ...e 75% de concordância média por caractere

# ── Vídeo público ──────────────────────────────────────────────────────────────
[privacidade]
bloco = 24               # bloco do mosaico em px do original (placa inteira aqui: 22 px de altura na mediana, 39 no p99)
altura_min = 100         # veículo com caixa desta altura para cima tem a faixa inferior sempre pixelada
faixa = [-0.05, 0.30, 1.05, 1.05]   # faixa em fração da caixa [x1, y1, x2, y2]: de 30% da altura até a base
folga_quadros = 5        # a faixa também vale alguns quadros antes e depois do rastro existir
largura_saida = 1280
# Áreas sempre pixeladas, em todo quadro. Aqui: a data queimada no relógio do canal (a hora fica).
tarjas = [[215, 0, 560, 46]]
